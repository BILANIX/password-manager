{% extends "base.html" %}
{% block title %}Log in · Password Manager{% endblock %}
{% block content %}
<section class="panel narrow"><h1>Welcome back</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Master password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="button" type="submit">Log in</button>
</form></section>
{% endblock %}
